plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
}

android {
    namespace 'ru.woodymsk.socialapp'
    compileSdk 34

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose true
    }

    defaultConfig {
        applicationId "ru.woodymsk.socialapp"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "1.0"
        viewBinding.enabled true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders.usesCleartextTraffic = false
            buildConfigField "String", "BASE_URL", "\"http://94.228.125.136:8080\""
        }
        debug {
            manifestPlaceholders.usesCleartextTraffic = true
            buildConfigField "String", "BASE_URL", "\"http://94.228.125.136:8080\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    
    kotlinOptions {
        jvmTarget = '1.8'
    }

    kapt {
        correctErrorTypes = true
        generateStubs = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.3.2"
    }
}

ext {
    core_version = "1.10.1"
    appcompat_version = "1.6.1"
    constraintlayout_version = "2.1.4"
    swiperefreshlayout_version = "1.1.0"
    recyclerview_version = "1.3.0"
    lifecycle_version = "2.6.1"
    mdc_version = "1.9.0"
    nav_version = "2.6.0"
    room_version = "2.5.2"
    retrofit_version = "2.9.0"
    okhttp_logging_version = "4.10.0"
    bom_version = "1.8.0"
    act_version = '1.9.0'
    glide_version = "4.14.2"
    gson_version = "2.9.0"
    dagger2_version = "2.42"
    javax_inject_version = "1"
    paging_version = "3.2.1"
    play_services_version = "21.3.0"
    imagepicker_version = "2.1"
    cicerone_version = "7.1"
    compose_version = '1.6.6'
    activity_compose_version = '1.9.0'
    lifecycle_viewmodel_compose_version = '2.8.0'
    compose_material3_version = '1.2.1'
    coil_compose_version = '2.2.2'
}

dependencies {
    implementation "androidx.core:core-ktx:$core_version"
    implementation "androidx.appcompat:appcompat:$appcompat_version"
    implementation "com.google.android.material:material:$mdc_version"
    implementation "androidx.constraintlayout:constraintlayout:$constraintlayout_version"
    implementation platform("org.jetbrains.kotlin:kotlin-bom:$bom_version")
    //noinspection GradleDependency
    implementation "androidx.recyclerview:recyclerview:$recyclerview_version"
    implementation "androidx.activity:activity-ktx:$act_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$lifecycle_version"
    implementation "androidx.navigation:navigation-fragment-ktx:$nav_version"
    implementation "androidx.navigation:navigation-ui-ktx:$nav_version"
    implementation "com.squareup.retrofit2:retrofit:$retrofit_version"
    implementation "com.squareup.retrofit2:converter-gson:$retrofit_version"
    implementation "com.squareup.okhttp3:logging-interceptor:$okhttp_logging_version"
    implementation "androidx.room:room-runtime:$room_version"
    implementation "androidx.room:room-ktx:$room_version"
    implementation "androidx.room:room-common:$room_version"
    implementation "androidx.room:room-paging:$room_version"
    implementation "androidx.swiperefreshlayout:swiperefreshlayout:$swiperefreshlayout_version"
    implementation "com.google.code.gson:gson:$gson_version"
    implementation "com.github.bumptech.glide:glide:$glide_version"
    implementation "com.google.dagger:dagger:$dagger2_version"
    implementation "com.google.dagger:dagger-android-support:$dagger2_version"
    implementation "javax.inject:javax.inject:$javax_inject_version"
    implementation "androidx.paging:paging-runtime-ktx:$paging_version"
    implementation "com.google.android.gms:play-services-cast-framework:$play_services_version"
    implementation "com.github.dhaval2404:imagepicker:$imagepicker_version"
    implementation "com.github.terrakok:cicerone:$cicerone_version"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    implementation "androidx.compose.foundation:foundation:$compose_version"
    implementation "androidx.compose.animation:animation:$compose_version"
    implementation "androidx.compose.runtime:runtime:$compose_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_viewmodel_compose_version"
    implementation "androidx.compose.material3:material3:$compose_material3_version"
    implementation "io.coil-kt:coil-compose:$coil_compose_version"
    annotationProcessor "com.google.dagger:dagger-android-processor:$dagger2_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    //noinspection KaptUsageInsteadOfKsp
    kapt "com.google.dagger:dagger-compiler:$dagger2_version"
    kapt "com.google.dagger:dagger-android-processor:$dagger2_version"
    kapt "androidx.room:room-compiler:$room_version"
    kapt "com.github.bumptech.glide:annotations:$glide_version"
    //noinspection KaptUsageInsteadOfKsp
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    //noinspection LifecycleAnnotationProcessorWithJava8
    kapt "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"

    implementation project(":core-coroutine")
}