plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'kotlin-android'
    id 'kotlin-kapt'
    id 'kotlinx-serialization'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'ru.woodymsk.socialapp'
    compileSdk 34

    buildFeatures {
        viewBinding = true
        buildConfig = true
        compose true
    }

    defaultConfig {
        applicationId "ru.woodymsk.socialapp"
        minSdk 26
        targetSdk 33
        versionCode 1
        versionName "1.0"
        viewBinding.enabled true
    }

    signingConfigs {
        release {
            def isSigningConfigExist  = localProperties.containsKey('STORE_FILE')
            if (isSigningConfigExist ) {
                storeFile file("${project.rootDir}/app/${localProperties['STORE_FILE']}")
                storePassword localProperties['STORE_PASSWORD']
                keyAlias localProperties['KEY_ALIAS']
                keyPassword localProperties['KEY_PASSWORD']
            } else {
                logger.warn("Release signing config not found! Using debug credentials.")
                storeFile file("debug.keystore")
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            }
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            archivesBaseName = "SocialApp-release"
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders.usesCleartextTraffic = false
            buildConfigField "String", "BASE_URL", getLocalProperty("BASE_URL")
            buildConfigField("String", "API_KEY", getLocalProperty("API_KEY"))
        }
        debug {
            manifestPlaceholders.usesCleartextTraffic = true
            buildConfigField "String", "BASE_URL", getLocalProperty("BASE_URL")
            buildConfigField("String", "API_KEY", getLocalProperty("API_KEY"))
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    kotlinOptions {
        jvmTarget = '17'
    }

    kapt {
        correctErrorTypes = true
        generateStubs = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.2"
    }
}

def getLocalProperty(String key) {
    Properties properties = new Properties()
    File localPropertiesFile = project.rootProject.file('local.properties')
    if (localPropertiesFile.exists()) {
        properties.load(localPropertiesFile.newDataInputStream())
        return "\"${properties.getProperty(key)}\""
    } else {
        throw new GradleException("local.properties file not found")
    }
}

ext {
    core_version = "1.10.1"
    appcompat_version = "1.6.1"
    constraintlayout_version = "2.1.4"
    swiperefreshlayout_version = "1.1.0"
    recyclerview_version = "1.3.0"
    lifecycle_version = "2.6.1"
    mdc_version = "1.9.0"
    nav_version = "2.6.0"
    room_version = "2.6.1"
    retrofit_version = "2.9.0"
    okhttp_logging_version = "4.10.0"
    bom_version = "1.8.0"
    act_version = '1.9.0'
    glide_version = "4.14.2"
    gson_version = "2.9.0"
    dagger2_version = "2.50"
    javax_inject_version = "1"
    paging_version = "3.3.6"
