    implementation "com.google.dagger:dagger-android-support:$dagger2_version"
    implementation "javax.inject:javax.inject:$javax_inject_version"
    implementation "androidx.paging:paging-runtime-ktx:$paging_version"
    implementation "androidx.paging:paging-compose-android:$paging_version"
    implementation "com.google.android.gms:play-services-cast-framework:$play_services_version"
    implementation "com.github.dhaval2404:imagepicker:$imagepicker_version"
    implementation "com.github.terrakok:cicerone:$cicerone_version"
    implementation "androidx.compose.ui:ui:$compose_version"
    implementation "androidx.compose.ui:ui-tooling-preview:$compose_version"
    implementation "androidx.activity:activity-compose:$activity_compose_version"
    implementation "androidx.compose.foundation:foundation:$compose_version"
    implementation "androidx.compose.animation:animation:$compose_version"
    implementation "androidx.compose.runtime:runtime:$compose_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-compose:$lifecycle_viewmodel_compose_version"
    implementation "androidx.compose.material:material:$compose_material_version"
    implementation "androidx.compose.material3:material3:$compose_material3_version"
    implementation "io.coil-kt:coil-compose:$coil_compose_version"
    implementation "io.coil-kt:coil-video:$coil_compose_version"
    implementation "org.jetbrains.kotlinx:kotlinx-serialization-json:$kotlinSerialization"
    implementation "androidx.navigation:navigation-compose:$compose_nav_version"
    implementation "com.google.accompanist:accompanist-permissions:$accompanist_permissions"
    implementation("androidx.media3:media3-exoplayer:$media3_version")
    implementation("androidx.media3:media3-ui:$media3_version")
    annotationProcessor "com.google.dagger:dagger-android-processor:$dagger2_version"
    debugImplementation "androidx.compose.ui:ui-tooling:$compose_version"
    //noinspection KaptUsageInsteadOfKsp
    kapt "com.google.dagger:dagger-compiler:$dagger2_version"
    kapt "com.google.dagger:dagger-android-processor:$dagger2_version"
    kapt "androidx.room:room-compiler:$room_version"
    kapt "com.github.bumptech.glide:annotations:$glide_version"
    //noinspection KaptUsageInsteadOfKsp
    kapt "com.github.bumptech.glide:compiler:$glide_version"
    //noinspection LifecycleAnnotationProcessorWithJava8
    kapt "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"

    implementation project(":core-coroutine")
}